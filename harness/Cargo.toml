[package]
name = "fourk-harness"
version = "0.1.0"
edition = "2024"
publish = false

# Test harness for the Fourk covenants: drives the Argent contract
# (contracts/fourk.ag, via its committed artifact) and the Silverscript drip
# dispenser (contracts/drip.sil, compiled here) through real signed
# transactions against the rusty-kaspa script engine. Same pattern as
# silverscript-lang's chess_apps_tests.rs. Dependency tags must match the
# silverscript workspace.

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
silverscript-lang = { path = "../../silverscript/silverscript-lang" }
# Drives the Argent port (contracts/fourk.ag) through argent-runtime's
# TxBuilder in tests/argent_tests.rs. Shares the rusty-kaspa pin above.
argent-runtime = { path = "../../argent-lang/argent/crates/argent-runtime" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
serde_json = "1"
# Commitment hashing for tests/simul_tests.rs — the same crate (and 32-byte
# unkeyed parameterization) the script engine's OpBlake2b uses.
blake2b_simd = "1"

[workspace]
