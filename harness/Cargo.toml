[package]
name = "fourk-harness"
version = "0.1.0"
edition = "2024"
publish = false

# Test harness for the Fourk covenants: drives the Argent contract
# (contracts/fourk.ag, via its committed artifact) and the Silverscript drip
# dispenser (contracts/drip.sil, compiled here) through real signed
# transactions against the rusty-kaspa script engine. Same pattern as
# silverscript-lang's chess_apps_tests.rs.
#
# Pins: the silverscript and rusty-kaspa revisions below must equal the ones
# argent's workspace pins at the argent-runtime revision — argent-runtime
# re-exports types from both, and two different git sources would be two
# different crates. Keep them equal to wasm/Cargo.toml as well.

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# Silverscript v1.0.0 (compiles contracts/drip.sil in tests/drip_tests.rs).
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03", package = "silverscript-lang" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03", package = "silverscript-abi" }
# Drives the Argent port (contracts/fourk.ag) through argent-runtime's
# TxBuilder in tests/argent_tests.rs and tests/simul_tests.rs.
argent-runtime = { git = "https://github.com/argent-lang/argent", rev = "867b080b973f93d75c4b7ca8ce06950a963accbb", package = "argent-runtime" }
# rusty-kaspa v2.0.1 plus one script-builder helper (the argent pin).
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
serde_json = "1"
# Commitment hashing for tests/simul_tests.rs — the same crate (and 32-byte
# unkeyed parameterization) the script engine's OpBlake2b uses.
blake2b_simd = "1"

[workspace]
