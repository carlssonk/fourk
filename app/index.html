<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defense-in-depth for hosts that ignore public/_headers. Deliberately
      minimal: a meta CSP also binds the dev server (HMR websocket, local
      ws:// nodes), and frame-ancestors is ignored in <meta> per spec — so
      the full policy lives in _headers / real response headers (DEPLOY.md).
    -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <meta
      name="description"
      content="Play Connect Four online with a friend. Pick columns together in Fourk mode or take turns in Classic. Free to play, no account needed."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#15100a" />
    <title>fourk | Connect Four online</title>
    <!-- Link previews (invites are shared in chats). Crawlers drop the #g=
         invite hash, so every link previews as the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fourk" />
    <meta property="og:url" content="https://fourk.io/" />
    <meta property="og:title" content="fourk | Connect Four online" />
    <meta
      property="og:description"
      content="Play Connect Four online with a friend. Pick columns together in Fourk mode or take turns in Classic. Free to play, no account needed."
    />
    <meta property="og:image" content="https://fourk.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="fourk.io, connect four on Kaspa: a board where blue has four in a row"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
