[package]
name = "fourk-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# Browser bindings for the Fourk covenant: embeds the Argent artifact
# (argentc build of contracts/fourk.ag) and exposes state -> redeem script
# and entrypoint -> signature script, so the React app can derive addresses
# and build spends entirely client-side without running a compiler.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
argent-runtime = { path = "../../argent-lang/argent/crates/argent-runtime" }
serde_json = "1"
# argent-runtime's kaspa/secp deps need the js randomness backend on wasm32 —
# both getrandom major versions appear in the tree.
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[workspace]
